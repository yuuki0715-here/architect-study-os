<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Study OS" />
  <title>一級建築士 Study OS</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">一級建築士 Study OS</p>
        <h1 id="screen-title">計画・西洋建築</h1>
      </div>
      <button id="reset-btn" class="text-btn" type="button">進捗リセット</button>
    </header>

    <section id="home-screen" class="screen">
      <div class="card hero">
        <div class="row between center">
          <div>
            <p class="muted">現在の学習単位</p>
            <h2 id="current-unit">計画 ＞ 西洋建築</h2>
          </div>
          <span id="question-count-badge" class="badge">0問</span>
        </div>

        <div class="progress-block">
          <div class="row between center">
            <span>進捗</span>
            <strong id="progress-text">0 / 0</strong>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div id="progress-bar" class="progress-bar" style="width:0%"></div>
          </div>
        </div>

        <button id="start-btn" class="primary-btn" type="button">学習を開始</button>
      </div>

      <div id="data-status" class="card notice"></div>

      <div class="card">
        <h2 class="section-title">問題データ</h2>
        <p class="muted">問題本文はWeb上に置かず、この端末だけに保存します。</p>
        <div class="action-stack">
          <button id="import-btn" class="secondary-btn" type="button">問題データを読み込む</button>
          <button id="delete-bank-btn" class="text-btn danger-text" type="button">端末の問題データを削除</button>
        </div>
        <input id="file-input" type="file" accept="application/json,.json" hidden />
      </div>

      <details class="card compact">
        <summary>Version 0.3 の仕組み</summary>
        <ul>
          <li>Web公開するのはアプリ本体だけ</li>
          <li>過去問本文・選択肢は端末内のIndexedDBに保存</li>
          <li>4択をタップして即時採点</li>
          <li>初回回答だけを進捗に加算</li>
          <li>現在地と回答履歴も端末内に保存</li>
          <li>一度読み込めば、オフラインでも演習可能</li>
        </ul>
      </details>
    </section>

    <section id="quiz-screen" class="screen hidden" aria-live="polite">
      <div class="quiz-meta row between center">
        <button id="back-btn" class="text-btn" type="button">← ホーム</button>
        <span id="quiz-position" class="muted">0 / 0</span>
      </div>

      <article class="card question-card">
        <div class="row wrap gap8">
          <span id="year-badge" class="badge"></span>
          <span id="source-badge" class="badge subtle"></span>
          <span id="classification-badge" class="badge subtle"></span>
        </div>
        <h2 id="question-heading"></h2>
        <p id="question-text" class="question-text"></p>
        <div id="choices" class="choices"></div>
      </article>

      <section id="result-card" class="card result-card hidden">
        <h3 id="result-title"></h3>
        <p id="result-explanation"></p>
        <button id="next-btn" class="primary-btn" type="button">次の問題</button>
      </section>
    </section>
  </main>

  <script src="./app.js" type="module"></script>
</body>
</html>
